name: financial-planning

# Local-first stack: one Postgres container, one Next.js container.
# `docker compose up` brings up a working local stack; `deploy.sh` is the runbook for
# updating a live one (dump before migrate — see that script).
#
# Every published port binds to 127.0.0.1 deliberately. Nothing is reachable from the
# LAN or the internet; `tailscale serve` proxies from the tailnet to localhost:3000 and
# terminates TLS there. See docs/DEPLOYMENT.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-financial_planning}
      # Deterministic collation, so ordering doesn't shift with the host locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only. Exposed at all so pg_dump/psql can be run from the host during
      # a restore test without exec-ing into the container.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financial_planning}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Overrides whatever .env says: inside the compose network the database host is
      # the service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-financial_planning}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health is the one unauthenticated route (see src/middleware.ts); it reports
      # app liveness plus whether Postgres answers, and nothing about household data.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Migrations run as a one-shot container, not as part of app startup — running them
  # on boot would mean a restart loop could re-run a half-applied migration, and it
  # would break deploy.sh's dump-then-migrate ordering.
  #
  #   docker compose run --rm migrate
  #
  # In the `tools` profile so `docker compose up` never starts it implicitly.
  migrate:
    profiles: ['tools']
    build:
      context: .
      target: migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-financial_planning}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    # Named volume, not a bind mount: this is the household's only copy of its
    # financial data until scripts/backup.sh has run. `docker compose down -v` destroys
    # it — see docs/DEPLOYMENT.md.
    name: financial-planning-pgdata
