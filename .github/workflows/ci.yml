name: CI

# One workflow, three checks, on every push and pull request. No CD: there is nothing
# for CI to deploy to — deployment is deploy.sh run on the household's own laptop
# (PROPOSAL.md, Tech stack).
#
# The point of CI on this repo is that it computes real retirement and tax numbers, so a
# regression should be caught before it reaches the household's actual figures.

on:
  push:
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Phase 1 added tests that only a real database can answer: that money columns keep
    # NUMERIC(14,2), that ON DELETE RESTRICT actually refuses to delete a person who owns
    # accounts, and that the committed migration SQL applies cleanly from an empty schema.
    # A scratch Postgres is a few lines here and the alternative is those tests being
    # skipped everywhere, which is worse than not having written them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financial_planning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # TEST_DATABASE_URL is what un-skips the schema integration tests. It points at the
      # scratch service above, which the tests drop and recreate — never at real data.
      - name: Unit tests
        run: npm run test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/financial_planning_test

      # Guard against a generated migration being left uncommitted: the SQL in drizzle/
      # is what actually runs against the household's data, so it must match the schema
      # file rather than being regenerated at deploy time.
      - name: Check Drizzle migrations are up to date with the schema
        run: |
          npx drizzle-kit generate --name=ci-drift-check
          # A newly generated migration is an *untracked* file, so `git diff` alone
          # would miss it — hence `git status --porcelain`, which reports both.
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/lib/db/schema.ts has changes with no committed migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain -- drizzle
            exit 1
          fi
        env:
          # drizzle-kit reads this for `generate`, but generation is offline — it never
          # connects. A syntactically valid placeholder keeps the config happy.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder

      # Same drift-guard shape as the migration check above, for a different single
      # source of truth: docs/PROPOSAL.md's Phased Delivery table is generated from
      # src/lib/roadmap/data.ts (npm run roadmap:sync), specifically so it and the
      # in-app /roadmap page can never silently disagree about phase status/scope/
      # dependencies. A hand-edit to the generated table, or a data.ts change without
      # re-running the sync script, fails here.
      - name: Check docs/PROPOSAL.md's roadmap table matches src/lib/roadmap/data.ts
        run: |
          npm run roadmap:sync
          if ! git diff --exit-code -- docs/PROPOSAL.md; then
            echo "::error::docs/PROPOSAL.md's Phased Delivery table doesn't match src/lib/roadmap/data.ts. Run 'npm run roadmap:sync' and commit the result."
            exit 1
          fi
